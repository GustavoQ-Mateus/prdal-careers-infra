name: prdal-careers

services:
  postgres:
    build:
      context: ./postgres
    image: prdal-careers-postgres:16-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prdal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-prdal_careers}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prdal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.15
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "127.0.0.1:${ELASTICMQ_PORT:-9324}:9324"

  doc-service:
    build:
      context: ../apps/doc-service
      dockerfile: Dockerfile
    environment:
      PRDAL_AMBIENTE: ${PRDAL_AMBIENTE:-producao}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?defina SERVICE_TOKEN no .env com pelo menos 32 bytes aleatorios}
    ports:
      - "127.0.0.1:${DOC_SERVICE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
    env_file:
      - path: ./.env
        required: false
      - path: ../apps/ai-service/.env
        required: false
      - path: ../.env
        required: false
    environment:
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-16000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_JUIZ_RELACAO: ${AI_JUIZ_RELACAO:-1}
      AI_TIMEOUT_PISO_S: ${AI_TIMEOUT_PISO_S:-5}
      AI_TIMEOUT_TETO_S: ${AI_TIMEOUT_TETO_S:-120}
      AI_ORCAMENTO_ENTRADA_TOKENS: ${AI_ORCAMENTO_ENTRADA_TOKENS:-30000}
      AI_CONTAGEM_TOKENS: ${AI_CONTAGEM_TOKENS:-api}
      AI_CARACTERES_POR_TOKEN: ${AI_CARACTERES_POR_TOKEN:-3}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DOC_SERVICE_URL: ${DOC_SERVICE_URL:-http://doc-service:8080}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}
      EMBED_DIMENSAO: ${EMBED_DIMENSAO:-384}
      RAG_LIMIAR_SIMILARIDADE: ${RAG_LIMIAR_SIMILARIDADE:-}
      PRDAL_AMBIENTE: ${PRDAL_AMBIENTE:-producao}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?defina SERVICE_TOKEN no .env com pelo menos 32 bytes aleatorios}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

  migracao:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env com a senha de POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_LLM_TIMEOUT_MS: ${AI_LLM_TIMEOUT_MS:-60000}
      COTA_TOKENS_DIA: ${COTA_TOKENS_DIA:-1000000}
      AI_GENERATE_TIMEOUT_MS: ${AI_GENERATE_TIMEOUT_MS:-300000}
      DOC_SERVICE_URL: ${DOC_SERVICE_URL:-http://doc-service:8080}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env com a senha de POSTGRES_PASSWORD}
      EMBED_DIMENSAO: ${EMBED_DIMENSAO:-384}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env com pelo menos 32 bytes aleatorios}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?defina SERVICE_TOKEN no .env com pelo menos 32 bytes aleatorios}
      PRDAL_HSTS: ${PRDAL_HSTS:-}
      PRDAL_HTTPS: ${PRDAL_HTTPS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-5173}}
      REFRESH_TTL_DIAS: ${REFRESH_TTL_DIAS:-7}
      REFRESH_TOLERANCIA_S: ${REFRESH_TOLERANCIA_S:-30}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      API_PREFIXO: ${API_PREFIXO:-}
      BALANCEADOR_IDLE_S: ${BALANCEADOR_IDLE_S:-60}
      HTTP_KEEPALIVE_TIMEOUT_MS: ${HTTP_KEEPALIVE_TIMEOUT_MS:-65000}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-66000}
      SSE_HEARTBEAT_MS: ${SSE_HEARTBEAT_MS:-15000}
      TURNO_LEASE_S: ${TURNO_LEASE_S:-60}
      PRONTIDAO_TIMEOUT_MS: ${PRONTIDAO_TIMEOUT_MS:-2000}
      DESLIGAMENTO_PRAZO_MS: ${DESLIGAMENTO_PRAZO_MS:-25000}
      API_VERSAO: ${API_VERSAO-v1}
      LOG_NIVEL: ${LOG_NIVEL:-info}
      STORAGE_DIR: /app/storage
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-prdal-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-prdal-local-segredo}
      SQS_ENDPOINT: ${SQS_ENDPOINT-http://elasticmq:9324}
      SQS_FILA_JOBS_URL: ${SQS_FILA_JOBS_URL:-http://elasticmq:9324/000000000000/prdal-jobs}
    ports:
      - "${API_PORT:-3000}:3000"
    stop_grace_period: 30s
    volumes:
      - apistorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migracao:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_API_VERSAO: ${VITE_API_VERSAO-${API_VERSAO-v1}}
    environment:
      PRDAL_HSTS: ${PRDAL_HSTS:-}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  pgdata:
  apistorage:
